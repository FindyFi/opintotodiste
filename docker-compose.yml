# Full local stack for opintotodiste. Nothing here depends on a sibling
# checkout - `git clone && docker compose up --build` is enough.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opintotodiste
      POSTGRES_PASSWORD: opintotodiste
      POSTGRES_DB: opintotodiste
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opintotodiste']
      interval: 2s
      timeout: 3s
      retries: 20

  # https://github.com/digitalcredentials/signing-service, pinned to the same
  # published image the deployed environments run rather than built from its
  # git HEAD, so local behaviour matches and startup stays fast.
  signing-service:
    image: digitalcredentials/signing-service:1.1.0
    ports:
      - '4006:4006'
    environment:
      PORT: 4006
      # One seed per "tenant"/instance; TENANT_SEED_TEST is what makes the
      # "test" instance both this app (SIGNING_SERVICE_INSTANCE_ID) and
      # oid4vci-issuer (SIGNING_SERVICE_INSTANCE) point at exist. "generate"
      # mints a fresh dev key on every start - fine for local dev, not for
      # anything that needs stable credential keys. The tenant signs as a
      # did:key; deployed ones sign as the site's did:web (README, "The ldp_vc
      # issuer as a did:web"), which needs https and so isn't used here.
      TENANT_SEED_TEST: generate

  # Built straight from its own repo, which ships its own Dockerfile, rather
  # than requiring a sibling checkout of ../oid4vci-issuer. Pin #main to a
  # tag or commit if you need a reproducible local stack.
  oid4vci-issuer:
    build:
      context: https://github.com/FindyFi/oid4vci-issuer.git#main
    ports:
      - '4007:4007'
    environment:
      PORT: 4007
      # Real wallets need a public HTTPS URL here. Set OID4VCI_PUBLIC_URL to
      # a tunnel's URL (see README, "Testing with a real wallet"). This value
      # is also the issuer id that the app puts into SD-JWT credentials, so it
      # must match OID4VCI_CREDENTIAL_ISSUER_ID in the app's environment below.
      CREDENTIAL_ISSUER: ${OID4VCI_PUBLIC_URL:-http://localhost:4007}
      # OpenBadgeCredential is the ldp_vc configuration (signed via
      # signing-service). OpenBadgeCredentialSdJwtVc is what wallets get: an
      # IETF SD-JWT VC (dc+sd-jwt) bound to the wallet's key and signed by
      # this service with its own key. Its vct is the shared Open Badge type
      # (https://openbadge.digicredential.eu, GitHub Pages), frozen v1: vct#integrity
      # pins its hash, so the issuer refuses to start if the published file
      # changes, as in the deployed environments. OpenBadgeCredentialSdJwt (VCDM 2.0 as
      # vc+sd-jwt) stays available, but wallets tested in I1 didn't accept it.
      CREDENTIAL_CONFIGURATIONS_SUPPORTED: '{"OpenBadgeCredential":{"format":"ldp_vc","credential_definition":{"@context":["https://www.w3.org/2018/credentials/v1","https://purl.imsglobal.org/spec/ob/v3p0/context-3.0.3.json"],"type":["VerifiableCredential","OpenBadgeCredential"]},"proof_types_supported":{"jwt":{"proof_signing_alg_values_supported":["ES256"]}}},"OpenBadgeCredentialSdJwt":{"format":"vc+sd-jwt","credential_definition":{"@context":["https://www.w3.org/ns/credentials/v2","https://purl.imsglobal.org/spec/ob/v3p0/context-3.0.3.json"],"type":["VerifiableCredential","OpenBadgeCredential"]},"credential_signing_alg_values_supported":["ES256"],"proof_types_supported":{"jwt":{"proof_signing_alg_values_supported":["ES256"]}},"cryptographic_binding_methods_supported":["jwk"]},"OpenBadgeCredentialSdJwtVc":{"format":"dc+sd-jwt","vct":"https://openbadge.digicredential.eu/credentials/v1/OpenBadgeVCT","vct#integrity":"sha256-zsJk+dcGspzwDjsiMx8RwFfDA+RVPhHB1L6ujXVNyOU=","cryptographic_binding_methods_supported":["jwk"],"credential_signing_alg_values_supported":["ES256"],"proof_types_supported":{"jwt":{"proof_signing_alg_values_supported":["ES256"]}},"credential_metadata":{"display":[{"name":"Opintotodiste","locale":"fi","description":"Open Badge Koski-opintotiedoista"},{"name":"Study credential","locale":"en","description":"Open Badge from Koski study records"}],"claims":[{"path":["achievement","name"],"display":[{"name":"Tutkinto tai suoritus","locale":"fi"},{"name":"Qualification","locale":"en"}]},{"path":["achievement","fieldOfStudy"],"display":[{"name":"Koulutusala","locale":"fi"},{"name":"Field of study","locale":"en"}]},{"path":["achievement","creator","name"],"display":[{"name":"Oppilaitos","locale":"fi"},{"name":"Institution","locale":"en"}]},{"path":["achievement","description"],"display":[{"name":"Kuvaus","locale":"fi"},{"name":"Description","locale":"en"}]},{"path":["awardedDate"],"display":[{"name":"Myönnetty","locale":"fi"},{"name":"Awarded on","locale":"en"}]}]}}}'
      # Private EC P-256 key (JWK) for signing SD-JWTs. "generate" makes a
      # fresh key on every start - fine for local dev, but credentials issued
      # before a restart no longer verify against the published JWKS.
      SD_JWT_SIGNING_KEY: generate
      # A self-signed certificate for that key, sent as x5c in SD-JWT headers
      # for wallets that find issuer keys only from certificates (Paradym).
      SD_JWT_X5C: generate
      # OpenID Federation Entity Configuration at
      # /.well-known/openid-federation, off unless FEDERATION_ENTITY_METADATA
      # is set. These come from .env, which Compose reads; make the lines with
      # oid4vci-issuer's `npm run federation:setup` (see README, "OpenID
      # Federation"). Needs the issuer to be built from a version that has it.
      FEDERATION_ENTITY_METADATA: ${FEDERATION_ENTITY_METADATA:-}
      FEDERATION_AUTHORITY_HINTS: ${FEDERATION_AUTHORITY_HINTS:-}
      FEDERATION_TRUST_MARKS: ${FEDERATION_TRUST_MARKS:-}
      # Only the ldp_vc configuration above needs signing-service.
      SIGNING_SERVICE_URL: http://signing-service:4006
      SIGNING_SERVICE_INSTANCE: test
      SIGNING_SERVICE_SUITE: ed25519
      # Must match the app's OID4VCI_ISSUER_TOKEN below.
      COORDINATOR_TOKEN: dev-coordinator-token-change-me
    depends_on:
      - signing-service

  app:
    build:
      context: .
    ports:
      - '3000:3000'
    environment:
      # The image says production; this stack runs on development secrets,
      # which a production start refuses (src/env-check.js).
      NODE_ENV: development
      PORT: 3000
      SESSION_SECRET: change-me
      DATABASE_URL: postgres://opintotodiste:opintotodiste@db:5432/opintotodiste
      # RP_ID/ORIGIN describe what the *browser* sees, not container
      # networking - stay as localhost since the app is still published to
      # the host at localhost:3000.
      RP_ID: localhost
      RP_NAME: Opintotodiste
      ORIGIN: http://localhost:3000
      ISSUER_ID: did:web:example.org
      ISSUER_NAME: Example Issuer
      SIGNING_SERVICE_URL: http://signing-service:4006
      SIGNING_SERVICE_INSTANCE_ID: test
      SIGNING_SERVICE_SUITE: ed25519
      OID4VCI_ISSUER_URL: http://oid4vci-issuer:4007
      OID4VCI_ISSUER_INSTANCE: test
      # Must match oid4vci-issuer's COORDINATOR_TOKEN above.
      OID4VCI_ISSUER_TOKEN: dev-coordinator-token-change-me
      # Wallet credentials are dc+sd-jwt, issued by oid4vci-issuer under the
      # OpenBadgeCredentialSdJwtVc configuration. OID4VCI_CREDENTIAL_VCT
      # must equal that configuration's vct; with it unset the app sends a
      # VCDM 2.0 VC instead (for OpenBadgeCredentialSdJwt), whose issuer id
      # must equal the oid4vci-issuer CREDENTIAL_ISSUER above (origin only).
      OID4VCI_CREDENTIAL_CONFIGURATION_ID: OpenBadgeCredentialSdJwtVc
      OID4VCI_CREDENTIAL_VCT: https://openbadge.digicredential.eu/credentials/v1/OpenBadgeVCT
      OID4VCI_CREDENTIAL_ISSUER_ID: ${OID4VCI_PUBLIC_URL:-http://localhost:4007}
    depends_on:
      db:
        condition: service_healthy
      signing-service:
        condition: service_started
      oid4vci-issuer:
        condition: service_started

volumes:
  db-data:
