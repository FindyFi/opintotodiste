# Full local stack for opintotodiste. Nothing here depends on a sibling
# checkout - `git clone && docker compose up --build` is enough.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opintotodiste
      POSTGRES_PASSWORD: opintotodiste
      POSTGRES_DB: opintotodiste
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U opintotodiste']
      interval: 2s
      timeout: 3s
      retries: 20

  # https://github.com/digitalcredentials/signing-service, pinned to the same
  # published image the deployed environments run rather than built from its
  # git HEAD, so local behaviour matches and startup stays fast.
  signing-service:
    image: digitalcredentials/signing-service:1.1.0
    ports:
      - '4006:4006'
    environment:
      PORT: 4006
      # One seed per "tenant"/instance; TENANT_SEED_TEST is what makes the
      # "test" instance both this app (SIGNING_SERVICE_INSTANCE_ID) and
      # oid4vci-issuer (SIGNING_SERVICE_INSTANCE) point at exist. "generate"
      # mints a fresh dev key on every start - fine for local dev, not for
      # anything that needs stable credential keys. The tenant signs as a
      # did:key; deployed ones sign as the site's did:web (README, "The ldp_vc
      # issuer as a did:web"), which needs https and so isn't used here.
      TENANT_SEED_TEST: generate

  # Built straight from its own repo, which ships its own Dockerfile, rather
  # than requiring a sibling checkout of ../oid4vci-issuer. Pin #main to a
  # tag or commit if you need a reproducible local stack.
  oid4vci-issuer:
    build:
      context: https://github.com/FindyFi/oid4vci-issuer.git#main
    ports:
      - '4007:4007'
    environment:
      PORT: 4007
      # Real wallets need a public HTTPS URL here. Set OID4VCI_PUBLIC_URL to
      # a tunnel's URL (see README, "Testing with a real wallet"). This value
      # is also the issuer id that the app puts into SD-JWT credentials, so it
      # must match OID4VCI_CREDENTIAL_ISSUER_ID in the app's environment below.
      CREDENTIAL_ISSUER: ${OID4VCI_PUBLIC_URL:-http://localhost:4007}
      # OpenBadgeCredential is the ldp_vc configuration (signed via
      # signing-service). OpenBadgeCredentialSdJwtVc is what wallets get: an
      # IETF SD-JWT VC (dc+sd-jwt) bound to the wallet's key and signed by
      # this service with its own key. Its vct is the shared Open Badge type
      # (https://openbadge.digicredential.eu, GitHub Pages), v2: vct#integrity
      # pins its hash, so the issuer refuses to start if the published file
      # changes, as in the deployed environments. OpenBadgeCredentialSdJwt (VCDM 2.0 as
      # vc+sd-jwt) stays available, but wallets tested in I1 didn't accept it.
      CREDENTIAL_CONFIGURATIONS_SUPPORTED: '{"OpenBadgeCredential":{"format":"ldp_vc","credential_definition":{"@context":["https://www.w3.org/2018/credentials/v1","https://purl.imsglobal.org/spec/ob/v3p0/context-3.0.3.json"],"type":["VerifiableCredential","OpenBadgeCredential"]},"proof_types_supported":{"jwt":{"proof_signing_alg_values_supported":["ES256"]}},"credential_metadata":{"display":[{"name":"Opintotodiste","locale":"fi","description":"Open Badge Koski-opintotiedoista","logo":{"uri":"${OPINTOTODISTE_PUBLIC_URL:-https://opintotodiste.development.findy.fi}/icons/logo-512.png","alt_text":"Opintotodisteen logo"},"background_color":"#1f3a5f","text_color":"#ffffff"},{"name":"Study credential","locale":"en","description":"Open Badge from Koski study records","logo":{"uri":"${OPINTOTODISTE_PUBLIC_URL:-https://opintotodiste.development.findy.fi}/icons/logo-512.png","alt_text":"Opintotodiste logo"},"background_color":"#1f3a5f","text_color":"#ffffff"}]}},"OpenBadgeCredentialSdJwt":{"format":"vc+sd-jwt","credential_definition":{"@context":["https://www.w3.org/ns/credentials/v2","https://purl.imsglobal.org/spec/ob/v3p0/context-3.0.3.json"],"type":["VerifiableCredential","OpenBadgeCredential"]},"credential_signing_alg_values_supported":["ES256"],"proof_types_supported":{"jwt":{"proof_signing_alg_values_supported":["ES256"]}},"cryptographic_binding_methods_supported":["jwk"],"credential_metadata":{"display":[{"name":"Opintotodiste","locale":"fi","description":"Open Badge Koski-opintotiedoista","logo":{"uri":"${OPINTOTODISTE_PUBLIC_URL:-https://opintotodiste.development.findy.fi}/icons/logo-512.png","alt_text":"Opintotodisteen logo"},"background_color":"#1f3a5f","text_color":"#ffffff"},{"name":"Study credential","locale":"en","description":"Open Badge from Koski study records","logo":{"uri":"${OPINTOTODISTE_PUBLIC_URL:-https://opintotodiste.development.findy.fi}/icons/logo-512.png","alt_text":"Opintotodiste logo"},"background_color":"#1f3a5f","text_color":"#ffffff"}]}},"OpenBadgeCredentialSdJwtVc":{"format":"dc+sd-jwt","vct":"https://openbadge.digicredential.eu/credentials/v2/OpenBadgeVCT","vct#integrity":"sha256-sLcPFkWmCd9/WjuTEQHA5JW+PpRXnONNwMooxEP2n7o=","cryptographic_binding_methods_supported":["jwk"],"credential_signing_alg_values_supported":["ES256"],"proof_types_supported":{"jwt":{"proof_signing_alg_values_supported":["ES256"]}},"credential_metadata":{"display":[{"name":"Opintotodiste","locale":"fi","description":"Open Badge Koski-opintotiedoista","logo":{"uri":"${OPINTOTODISTE_PUBLIC_URL:-https://opintotodiste.development.findy.fi}/icons/logo-512.png","alt_text":"Opintotodisteen logo"},"background_color":"#1f3a5f","text_color":"#ffffff"},{"name":"Study credential","locale":"en","description":"Open Badge from Koski study records","logo":{"uri":"${OPINTOTODISTE_PUBLIC_URL:-https://opintotodiste.development.findy.fi}/icons/logo-512.png","alt_text":"Opintotodiste logo"},"background_color":"#1f3a5f","text_color":"#ffffff"}],"claims":[{"path":["achievement","name"],"display":[{"name":"Tutkinto tai suoritus","locale":"fi"},{"name":"Qualification","locale":"en"}]},{"path":["achievement","fieldOfStudy"],"display":[{"name":"Koulutusala","locale":"fi"},{"name":"Field of study","locale":"en"}]},{"path":["achievement","creator","name"],"display":[{"name":"Oppilaitos","locale":"fi"},{"name":"Institution","locale":"en"}]},{"path":["achievement","description"],"display":[{"name":"Kuvaus","locale":"fi"},{"name":"Description","locale":"en"}]},{"path":["awardedDate"],"display":[{"name":"Myönnetty","locale":"fi"},{"name":"Awarded on","locale":"en"}]},{"path":["grade"],"display":[{"name":"Arvosana","locale":"fi"},{"name":"Grade","locale":"en"}]},{"path":["extent"],"display":[{"name":"Laajuus","locale":"fi"},{"name":"Extent","locale":"en"}]},{"path":["result"],"display":[{"name":"Tulokset","locale":"fi"},{"name":"Results","locale":"en"}]},{"path":["result",null,"value"],"display":[{"name":"Tulos","locale":"fi"},{"name":"Result","locale":"en"}]},{"path":["result",null,"status"],"display":[{"name":"Tila","locale":"fi"},{"name":"Status","locale":"en"}]},{"path":["given_name"],"display":[{"name":"Etunimet","locale":"fi"},{"name":"Given names","locale":"en"}]},{"path":["family_name"],"display":[{"name":"Sukunimi","locale":"fi"},{"name":"Family name","locale":"en"}]}]}},"StudentStatusSdJwtVc":{"format":"dc+sd-jwt","vct":"https://openbadge.digicredential.eu/credentials/student-status/v1/StudentStatusVCT","vct#integrity":"sha256-7Jmwf4t98ylr3XSaOLcU69ht4yGoZQ72kMxZ/5MGNWM=","cryptographic_binding_methods_supported":["jwk"],"credential_signing_alg_values_supported":["ES256"],"proof_types_supported":{"jwt":{"proof_signing_alg_values_supported":["ES256"]}},"credential_metadata":{"display":[{"name":"Opiskelijatodiste","locale":"fi","description":"Koski-tietovarannon mukaan läsnä oleva opiskelija","logo":{"uri":"${OPINTOTODISTE_PUBLIC_URL:-https://opintotodiste.development.findy.fi}/icons/logo-512.png","alt_text":"Opintotodisteen logo"},"background_color":"#ff1493","text_color":"#0d0342"},{"name":"Student status","locale":"en","description":"Enrolled as a student according to the Finnish national study records (Koski)","logo":{"uri":"${OPINTOTODISTE_PUBLIC_URL:-https://opintotodiste.development.findy.fi}/icons/logo-512.png","alt_text":"Opintotodiste logo"},"background_color":"#ff1493","text_color":"#0d0342"}],"claims":[{"path":["sub"],"display":[{"locale":"fi","name":"Oppijanumero"},{"locale":"en","name":"Learner number"}]},{"path":["given_name"],"display":[{"locale":"fi","name":"Etunimet"},{"locale":"en","name":"Given names"}]},{"path":["family_name"],"display":[{"locale":"fi","name":"Sukunimi"},{"locale":"en","name":"Family name"}]},{"path":["birthdate"],"display":[{"locale":"fi","name":"Syntymäaika"},{"locale":"en","name":"Date of birth"}]},{"path":["enrolment_status"],"mandatory":true,"display":[{"locale":"fi","name":"Opiskelutilanne"},{"locale":"en","name":"Enrolment status"}]},{"path":["institution_name"],"mandatory":true,"display":[{"locale":"fi","name":"Oppilaitos"},{"locale":"en","name":"Institution"}]},{"path":["institution_id"],"display":[{"locale":"fi","name":"Oppilaitoksen tunniste (OID)"},{"locale":"en","name":"Institution identifier (OID)"}]},{"path":["institution_code"],"display":[{"locale":"fi","name":"Oppilaitosnumero"},{"locale":"en","name":"Institution number"}]},{"path":["education_level"],"display":[{"locale":"fi","name":"Koulutusaste (koodi)"},{"locale":"en","name":"Level of education (code)"}]},{"path":["education_level_name"],"display":[{"locale":"fi","name":"Koulutusaste"},{"locale":"en","name":"Level of education"}]},{"path":["education_type"],"display":[{"locale":"fi","name":"Koulutusmuoto (koodi)"},{"locale":"en","name":"Type of education (code)"}]},{"path":["education_type_name"],"display":[{"locale":"fi","name":"Koulutusmuoto"},{"locale":"en","name":"Type of education"}]},{"path":["programme"],"display":[{"locale":"fi","name":"Koulutus"},{"locale":"en","name":"Programme"}]},{"path":["start_date"],"display":[{"locale":"fi","name":"Opinnot alkaneet"},{"locale":"en","name":"Studies started"}]},{"path":["expiry_date"],"mandatory":true,"display":[{"locale":"fi","name":"Voimassa asti"},{"locale":"en","name":"Valid until"}]},{"path":["issuance_date"],"mandatory":true,"display":[{"locale":"fi","name":"Tilanne päivältä"},{"locale":"en","name":"Status as of"}]},{"path":["issuing_country"],"display":[{"locale":"fi","name":"Myöntäjämaa"},{"locale":"en","name":"Issuing country"}]}]}}}'
      # Private EC P-256 key (JWK) for signing SD-JWTs. "generate" makes a
      # fresh key on every start - fine for local dev, but credentials issued
      # before a restart no longer verify against the published JWKS.
      SD_JWT_SIGNING_KEY: generate
      # A self-signed certificate for that key, sent as x5c in SD-JWT headers
      # for wallets that find issuer keys only from certificates (Paradym).
      SD_JWT_X5C: generate
      # Who issues, for wallets to show (issuer `display`, name and logo per
      # language; the first language is what most wallets show). The
      # federation display_name and logo_uri default to it. oid4vci-issuer's
      # `npm run metadata:setup -- --json` makes the JSON. Logos come from
      # OPINTOTODISTE_PUBLIC_URL (the app's public https URL, e.g. a tunnel),
      # by default the development deployment: wallets need an https URL.
      OID4VCI_ISSUER_METADATA: '{"display":[{"locale":"fi","name":"Opintotodiste","logo":{"uri":"${OPINTOTODISTE_PUBLIC_URL:-https://opintotodiste.development.findy.fi}/icons/logo-512.png","alt_text":"Opintotodisteen logo"}},{"locale":"en","name":"Study credential","logo":{"uri":"${OPINTOTODISTE_PUBLIC_URL:-https://opintotodiste.development.findy.fi}/icons/logo-512.png","alt_text":"Opintotodiste logo"}}]}'
      # OpenID Federation Entity Configuration at
      # /.well-known/openid-federation, off unless FEDERATION_ENTITY_METADATA
      # is set. These come from .env, which Compose reads; make the lines with
      # oid4vci-issuer's `npm run federation:setup` (see README, "OpenID
      # Federation"). Needs the issuer to be built from a version that has it.
      FEDERATION_ENTITY_METADATA: ${FEDERATION_ENTITY_METADATA:-}
      FEDERATION_AUTHORITY_HINTS: ${FEDERATION_AUTHORITY_HINTS:-}
      FEDERATION_TRUST_MARKS: ${FEDERATION_TRUST_MARKS:-}
      # Only the ldp_vc configuration above needs signing-service.
      SIGNING_SERVICE_URL: http://signing-service:4006
      SIGNING_SERVICE_INSTANCE: test
      SIGNING_SERVICE_SUITE: ed25519
      # Must match the app's OID4VCI_ISSUER_TOKEN below.
      COORDINATOR_TOKEN: dev-coordinator-token-change-me
    depends_on:
      - signing-service

  app:
    build:
      context: .
    ports:
      - '3000:3000'
    environment:
      # The image says production; this stack runs on development secrets,
      # which a production start refuses (src/env-check.js).
      NODE_ENV: development
      PORT: 3000
      SESSION_SECRET: change-me
      DATABASE_URL: postgres://opintotodiste:opintotodiste@db:5432/opintotodiste
      # RP_ID/ORIGIN describe what the *browser* sees, not container
      # networking - stay as localhost since the app is still published to
      # the host at localhost:3000.
      RP_ID: localhost
      RP_NAME: Opintotodiste
      ORIGIN: http://localhost:3000
      ISSUER_ID: did:web:example.org
      ISSUER_NAME: Example Issuer
      SIGNING_SERVICE_URL: http://signing-service:4006
      SIGNING_SERVICE_INSTANCE_ID: test
      SIGNING_SERVICE_SUITE: ed25519
      OID4VCI_ISSUER_URL: http://oid4vci-issuer:4007
      OID4VCI_ISSUER_INSTANCE: test
      # Must match oid4vci-issuer's COORDINATOR_TOKEN above.
      OID4VCI_ISSUER_TOKEN: dev-coordinator-token-change-me
      # Wallet credentials are dc+sd-jwt, issued by oid4vci-issuer under the
      # OpenBadgeCredentialSdJwtVc configuration. OID4VCI_CREDENTIAL_VCT
      # must equal that configuration's vct; with it unset the app sends a
      # VCDM 2.0 VC instead (for OpenBadgeCredentialSdJwt), whose issuer id
      # must equal the oid4vci-issuer CREDENTIAL_ISSUER above (origin only).
      OID4VCI_CREDENTIAL_CONFIGURATION_ID: OpenBadgeCredentialSdJwtVc
      OID4VCI_CREDENTIAL_VCT: https://openbadge.digicredential.eu/credentials/v2/OpenBadgeVCT
      OID4VCI_CREDENTIAL_ISSUER_ID: ${OID4VCI_PUBLIC_URL:-http://localhost:4007}
      # A student status goes to wallets as its own type (K5), under the
      # StudentStatusSdJwtVc configuration above, whose vct this must equal.
      OID4VCI_STUDENT_STATUS_CONFIGURATION_ID: StudentStatusSdJwtVc
      OID4VCI_STUDENT_STATUS_VCT: https://openbadge.digicredential.eu/credentials/student-status/v1/StudentStatusVCT
    depends_on:
      db:
        condition: service_healthy
      signing-service:
        condition: service_started
      oid4vci-issuer:
        condition: service_started

volumes:
  db-data:
