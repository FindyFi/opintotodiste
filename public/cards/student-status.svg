<svg xmlns="http://www.w3.org/2000/svg" width="856" height="540" viewBox="0 0 856 540">
  <!-- Card background of the student status credential (docker-compose.yml, "background_image"). No text: one file serves every language.
       Hot pink #ff1493 is the fallback background_color; the text_color is navy #0d0342. Patterns only get lighter than the pink,
       which keeps the navy text above 4.5:1. Keep the top-left (logo and name) and the bottom strip calm. -->
  <defs>
    <clipPath id="card"><rect width="856" height="540"/></clipPath>
  </defs>
  <rect width="856" height="540" fill="#ff1493"/>
  <g clip-path="url(#card)" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2">
    <!-- Mortarboard of the student theme, enlarged and cropped at the right edge. -->
    <g transform="translate(540 70) scale(12)" stroke-width="0.16" stroke-opacity="0.35" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4 2 9l10 5 10-5z"/>
      <path d="M6 11.5V16c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6v-4.5M22 9v7"/>
    </g>
    <circle cx="720" cy="200" r="190"/>
    <circle cx="720" cy="200" r="250"/>
    <circle cx="720" cy="200" r="310"/>
  </g>
</svg>
