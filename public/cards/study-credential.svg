<svg xmlns="http://www.w3.org/2000/svg" width="856" height="540" viewBox="0 0 856 540">
  <!-- Card background of the Open Badge credentials (docker-compose.yml, "background_image"). No text: one file serves every language.
       Navy #1f3a5f is the fallback background_color; the text_color is white. Keep the top-left (logo and name) and the bottom strip calm. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#17304f"/>
    </linearGradient>
    <clipPath id="card"><rect width="856" height="540"/></clipPath>
  </defs>
  <rect width="856" height="540" fill="url(#bg)"/>
  <g clip-path="url(#card)" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
    <!-- Rosette of the app logo, enlarged and cropped at the right edge. -->
    <g transform="translate(560 40) scale(17)" stroke-width="0.14" stroke-opacity="0.16" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="9" r="6"/>
      <path d="M8.5 13.8 7 22l5-3 5 3-1.5-8.2"/>
    </g>
    <circle cx="700" cy="190" r="150"/>
    <circle cx="700" cy="190" r="210"/>
    <circle cx="700" cy="190" r="270"/>
    <circle cx="700" cy="190" r="330"/>
  </g>
</svg>
