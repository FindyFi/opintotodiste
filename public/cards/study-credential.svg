<svg xmlns="http://www.w3.org/2000/svg" width="856" height="540" viewBox="0 0 856 540">
  <!-- Card background of the Open Badge credentials (docker-compose.yml, "background_image"). No text: one file serves every language.
       Same radial gradient and centre as the Open Badge card template (OpenBadge_v3.svg), whose navy #1f3a5f is the fallback
       background_color; the text_color is white.
       Keep the left side (logo and name) and the bottom strip calm. -->
  <defs>
    <radialGradient id="bg" cx="744" cy="210" r="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f86c2"/>
      <stop offset="0.45" stop-color="#1f3a5f"/>
      <stop offset="1" stop-color="#11223a"/>
    </radialGradient>
  </defs>
  <rect width="856" height="540" fill="url(#bg)"/>
  <!-- Rosette of the app logo: its circle (12,9) lands on the gradient's centre (744,210), in the vertical middle so that wallets with a wider card layout (Hovi) crop only calm areas. -->
  <g transform="translate(540 57) scale(17)" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.14" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="9" r="6"/>
    <path d="M8.5 13.8 7 22l5-3 5 3-1.5-8.2"/>
  </g>
</svg>
